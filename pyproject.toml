[project]
name = "coppuccino"
version = "2.0.0"
description = "Fit distributions with normalizing flows + copulas with JAX"
authors = [
    {name = "Aaron D. Johnson", email = "aaron9035@gmail.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # jaxlib 0.7.x ships cp311-cp314 wheels so a single version spans every
    # supported Python including 3.14. The ceiling is set by a BatchTracer
    # rejection inside flowjax's own input check from jax 0.8.2 onward; see
    # README "Requirements" for the versions actually exercised and the
    # environment they were measured in. The 3.12+ `issubclass` typing failure
    # is handled by the jaxtyping>=0.3.6 floor below.
    "jax>=0.4.38,<0.8",
    "jaxlib>=0.4.38,<0.8",
    "numpy>=1.26,<3.0.0",
    # scipy only shipped cp312 wheels from 1.11.x, so the oldest installable
    # version differs by Python (older scipy would build from source on 3.12).
    "scipy>=1.10,<2.0.0; python_version < '3.12'",
    "scipy>=1.11.3,<2.0.0; python_version >= '3.12'",
    "equinox>=0.13.2,<0.14.0",
    "flowjax>=17.2.1,<18.0.0",
    # jaxtyping >=0.3.6 carries the Python 3.12 `issubclass` typing fix.
    "jaxtyping>=0.3.6,<0.4.0",
    # paramax is still pre-1.0, where a minor release may break API, and
    # coppuccino imports `non_trainable`/`unwrap` from it directly. flowjax
    # 17.2.1 requires it as a bare "paramax" with no specifier, so nothing else
    # in the resolution graph bounds it. The cost of the ceiling is that the day
    # paramax cuts 0.1.0, users on a newer flowjax that requires it are left
    # with an unsatisfiable resolution until coppuccino ships a release that
    # widens this line. That is a deliberate trade: a loud resolver failure over
    # a silent API break in the two functions the whole fitted-model pickle
    # format depends on.
    "paramax>=0.0.3,<0.1.0",
    # imported directly by coppuccino.fleet (flowjax also depends on it,
    # but a direct import deserves a direct declaration)
    "optax>=0.2.2,<0.3.0",
    "cloudpickle>=2.2.1,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/AaronDJohnson/coppuccino"
Repository = "https://github.com/AaronDJohnson/coppuccino"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coppuccino"]

[tool.hatch.build.targets.sdist]
# Keep the sdist to source, tests, examples, and the prose that ships with the
# package (README + CHANGELOG). Without an explicit list hatchling ships every
# VCS-tracked file, which pulled in local editor config (.claude/), the 1.8 MB
# logo, and CI internals. `docs/` is deliberately *not* included: it holds a
# LaTeX methods write-up and its build products, not packaging-relevant text.
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]
# Ship the example notebooks but not the 363 KB posterior data file they load,
# and keep local editor config out of the release. `.gitignore` /
# `.gitattributes` are *not* listed, because excluding them never did anything:
# built from this config, the sdist contains `.gitignore` (hatchling
# force-includes it — it needs it for VCS file selection) and does not contain
# `.gitattributes` at all. An exclude entry for either was inert; the honest
# record is to not pretend they are controlled here.
exclude = ["/examples/data", "/tests/.claude"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
# Optional extras for the one-off benchmark drivers under scripts/. They are not
# imported by the package or the test suite, so they stay out of `dev`.
bench = [
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unknown marks are a typo, not a feature: fail rather than silently skipping
# the selection the mark was meant to drive.
addopts = "--strict-markers --strict-config"
# No allowances: the suite passes with warnings as errors and nothing filtered.
# Two `ignore:` entries were carried here briefly and both proved inert -- the
# suite is byte-identical with and without them -- so they are not kept.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Example notebooks are illustrative, not part of the package surface.
extend-exclude = ["examples"]

[tool.ruff.lint]
# pyflakes (F) + a curated pycodestyle set, plus the bug-shaped rulesets:
# flake8-bugbear (B), flake8-comprehensions (C4), isort (I), flake8-simplify
# (SIM) and McCabe (C901). E501 (line length) is intentionally off: the
# docstrings carry long math/prose lines by design.
select = ["E4", "E7", "E9", "F", "W", "B", "C4", "I", "SIM", "C901"]
ignore = [
    # `zip(a, b, strict=...)` — the numerical code zips arrays whose lengths are
    # established by construction a few lines earlier (knots vs. derivatives,
    # candidates vs. their scores). Requiring an explicit `strict=` on each of
    # those reads as noise, and `strict=True` would convert an internal
    # invariant violation into a ValueError from an unrelated line.
    "B905",
]

[tool.ruff.lint.mccabe]
# 15 is the cyclomatic complexity of the most complex function this project is
# willing to accept. No function carries a `noqa: C901` exemption, and new code
# must stay under rather than add one.
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["coppuccino"]

[tool.ruff.lint.per-file-ignores]
# __init__.py enables JAX x64 mode before importing submodules, so those imports
# are deliberately not at the top of the file (E402), which also defeats isort's
# single-block assumption (I001).
"src/coppuccino/__init__.py" = ["E402", "I001"]

[tool.ruff.format]
# Settings for anyone who runs `ruff format` on a file they are already
# rewriting. It is deliberately NOT a CI gate: `ruff format --check` currently
# reports 17 of 19 files as unformatted, and `ruff format --diff` replaces about
# 1.5k lines of hand-laid numerical code and its aligned comments with about
# 2.1k -- not a diff anyone would review.
# CONTRIBUTING therefore asks for "match the surrounding style", not for a
# formatter run. `quote-style = "preserve"` keeps the single quotes that appear
# throughout the numerical modules.
quote-style = "preserve"

[tool.mypy]
files = ["src/coppuccino"]
# The scientific stack (jax, flowjax, equinox, paramax) ships partial
# or no type information, so the third-party half of the graph is unresolvable.
# Our own half is checked in full: `check_untyped_defs` is on, so the body of an
# unannotated numerical helper is analysed too. Measured against the pre-change
# source, where several such helpers still existed: planting
# `_typo_check: int = "not an int"` inside `_rqs_bulk` and `_bad: int = "nope"`
# inside `_resolve_seed` produced "Success: no issues found" under the previous
# settings and two errors under these. bijections.py no longer has a
# fully-unannotated function for that probe to land in, which is the point.
ignore_missing_imports = true
check_untyped_defs = true
# There are no module-wide `disable_error_code` overrides. Four per-line
# `# type: ignore[<code>]` remain, so a real error of the same code anywhere
# else in the same module still fails the build. All four are equinox's
# AbstractVar/ClassVar shape fields and the __init__ signature it synthesises
# from them: the two ClassVar fields of `SmoothMarginalToGaussian` in
# bijections.py, and its two construction sites in copula_flows.py /
# model_io.py.
