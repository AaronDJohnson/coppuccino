name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: no job here needs to write to the repository. Actions are pinned to
# full commit SHAs (see publish.yml for the rationale); Dependabot bumps them.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true

      - name: Ruff (lint)
        run: uv run --python 3.12 ruff check .

      # `ruff format` is deliberately not enforced -- see the note on
      # [tool.ruff.format] in pyproject.toml -- so there is no --check step here.

      - name: Mypy (type check)
        run: uv run --python 3.12 mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # "highest" uses the committed uv.lock; "lowest-direct" exercises the
        # oldest supported dependency versions declared in pyproject.toml.
        resolution: ["highest", "lowest-direct"]
        exclude:
          # The oldest pinned numpy/scipy predate cp313/cp314 wheels, so the
          # lowest-direct floors aren't installable on 3.13+ (a normal install
          # there resolves newer versions, which the "highest" job covers).
          - python-version: "3.13"
            resolution: "lowest-direct"
          - python-version: "3.14"
            resolution: "lowest-direct"
        include:
          # Thin macOS slice: confirm runtime on the oldest and newest Python
          # (full Python x resolution sweep stays on the faster Ubuntu runners).
          - os: macos-latest
            python-version: "3.11"
            resolution: "highest"
          - os: macos-latest
            python-version: "3.14"
            resolution: "highest"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      # Most of the suite's time is JAX tracing and compiling a fresh program
      # for each fitted flow, not training. Two things cut it: one pytest worker
      # per core (worksteal rebalances the few long tests), and a compilation
      # cache shared by the workers, so a program another fit or worker already
      # compiled is loaded instead of rebuilt. Measured locally with 4 workers:
      # 205 s serial, 80 s with workers, 64 s with the cache as well. The cache
      # starts empty on every run.
      - name: Run tests (${{ matrix.resolution }} resolution)
        env:
          JAX_COMPILATION_CACHE_DIR: ${{ runner.temp }}/jax-cache
          JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
          JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES: "-1"
        run: >
          uv run --python ${{ matrix.python-version }}
          --resolution ${{ matrix.resolution }}
          pytest tests/ -q -n auto --dist worksteal
