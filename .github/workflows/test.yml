name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: no job here needs to write to the repository. Actions are pinned to
# full commit SHAs (see publish.yml for the rationale); Dependabot bumps them.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true

      - name: Ruff (lint)
        run: uv run --python 3.12 ruff check .

      # `ruff format` is deliberately not enforced -- see the note on
      # [tool.ruff.format] in pyproject.toml -- so there is no --check step here.

      - name: Mypy (type check)
        run: uv run --python 3.12 mypy

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.resolution }}, ${{ matrix.shard.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # "highest" uses the committed uv.lock; "lowest-direct" exercises the
        # oldest supported dependency versions declared in pyproject.toml.
        resolution: ["highest", "lowest-direct"]
        # Each configuration runs the whole suite, split across two runners
        # so that neither takes much more than half the time. The second
        # shard is "everything the first one does not name", so a new test
        # file lands there without editing this list.
        shard:
          - name: single-flow
            args: >-
              tests/test_copula_flows.py tests/test_bijections.py
              tests/test_model_io.py tests/test_hdr.py
          - name: fleet-and-selection
            args: >-
              tests/
              --ignore=tests/test_copula_flows.py --ignore=tests/test_bijections.py
              --ignore=tests/test_model_io.py --ignore=tests/test_hdr.py
        exclude:
          # The oldest pinned numpy/scipy predate cp313/cp314 wheels, so the
          # lowest-direct floors aren't installable on 3.13+ (a normal install
          # there resolves newer versions, which the "highest" job covers).
          - python-version: "3.13"
            resolution: "lowest-direct"
          - python-version: "3.14"
            resolution: "lowest-direct"
          # Thin macOS slice: confirm runtime on the oldest and newest Python
          # (full Python x resolution sweep stays on the faster Ubuntu runners).
          - os: macos-latest
            resolution: "lowest-direct"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      # Most of the suite's time is JAX tracing and compiling a fresh program
      # for each fitted flow, not training, and that work is spread over one
      # pytest worker per core (worksteal rebalances the few long tests).
      - name: Run tests (${{ matrix.resolution }} resolution, ${{ matrix.shard.name }})
        run: >
          uv run --python ${{ matrix.python-version }}
          --resolution ${{ matrix.resolution }}
          pytest ${{ matrix.shard.args }} -q -n auto --dist worksteal
