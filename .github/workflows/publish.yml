name: Publish to PyPI

# Publishes the package whenever a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API tokens are stored in the repo.
#
# Every action is pinned to a full commit SHA rather than a tag or branch: this
# workflow holds the trusted-publisher grant, and a tag (let alone a branch ref
# such as the upstream-recommended `@release/v1`) can be moved by the action's
# owner at any time. Dependabot bumps the SHAs and rewrites the trailing version
# comment; keep the two in sync by hand if you edit a pin manually.
on:
  release:
    types: [published]

# Least privilege by default. Each job re-declares only what it needs.
permissions: {}

jobs:
  test:
    name: Test the released commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        # Oldest and newest supported Python. test.yml runs the full matrix on
        # push/PR to main; this leg exists so that a release cut from a commit
        # that never went through main cannot upload an untested artifact.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      # hatchling assembles the wheel from the filesystem, so a source file that
      # is untracked in git is present locally and absent from a CI checkout.
      # Installing and importing the built wheel is what catches that.
      - name: Import the built wheel in a clean environment
        run: |
          uv venv /tmp/wheelcheck
          VIRTUAL_ENV=/tmp/wheelcheck uv pip install dist/*.whl
          /tmp/wheelcheck/bin/python -c "import coppuccino; print(coppuccino.__file__)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Scopes the trusted-publisher grant; add required reviewers in the repo's
    # Settings > Environments > pypi for an extra manual approval gate.
    environment:
      name: pypi
      url: https://pypi.org/p/coppuccino
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
